<style>

/* Floating cards over a full-screen map. Colors are tokens; the theme is set on <html data-theme>. */
:root {
  --map: #f2f3f0; --card: #ffffff; --fg: #1d2024; --muted: #6b737c; --line: #eceef0; --soft: #f3f4f6;
  --shadow: 0 10px 30px rgba(20, 28, 40, 0.14); --shadow-sm: 0 3px 12px rgba(20, 28, 40, 0.12);
  --ok: #2f9e5b; --late: #7a4706; --late-bg: #fbeed6; --early: #0b5a8a; --early-bg: #dcecf7; --ontime-bg: #e3f3e8; --ontime: #1f6b3d;
  --pri: #1d2024; --pri-fg: #ffffff; --origin: #1d2024; --dest: #ffcc33; --casing: #ffffff; --bus-ring: #ffffff;
  --sans: "Manrope", system-ui, -apple-system, "Segoe UI", sans-serif;
}
/* Dark theme: neutral, slightly cool greys that match the dark vector map; chosen with the theme button (or the system). */
:root[data-theme="dark"] {
  --map: #171a1e; --card: #22262b; --fg: #e9ecef; --muted: #98a1aa; --line: #30353b; --soft: #2b3036;
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.5); --shadow-sm: 0 3px 12px rgba(0, 0, 0, 0.45);
  --late: #f3c46e; --late-bg: #3a3122; --early: #9fd0f2; --early-bg: #1c2f3d; --ontime-bg: #1d3326; --ontime: #8fdcab;
  --pri: #e9ecef; --pri-fg: #171a1e; --origin: #e9ecef; --casing: #171a1e; --bus-ring: #171a1e; color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; background: var(--map); color: var(--fg); font: 14px/1.4 var(--sans); }
button { font: inherit; color: inherit; }
.n { font-variant-numeric: tabular-nums; }
#map { position: fixed; inset: 0; background: var(--map); }
.leaflet-container { font-family: var(--sans); background: var(--map); }
.leaflet-control-attribution { font-size: 10px; }

.card { background: var(--card); border-radius: 24px; box-shadow: var(--shadow); }
.pill { background: var(--card); border-radius: 999px; box-shadow: var(--shadow-sm); }

/* top bar */
.top { position: fixed; z-index: 1000; left: max(14px, env(safe-area-inset-left)); right: 70px; top: calc(14px + env(safe-area-inset-top)); display: flex; gap: 8px; flex-wrap: wrap; align-items: center; pointer-events: none; }
.top > * { pointer-events: auto; }
.trip-pill { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-weight: 700; font-size: 13px; border: 0; cursor: pointer; max-width: 100%; }
.trip-pill .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); flex: none; }
.trip-pill.stale .dot { background: #c9a227; } .trip-pill.err .dot { background: #d64545; }
.trip-pill span.t { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 8px 13px; font-weight: 800; font-size: 12px; border: 0; cursor: pointer; }
.chip i { width: 9px; height: 9px; border-radius: 50%; }
.chip[aria-pressed="false"] { opacity: 0.45; }
.chip:focus-visible, .btn:focus-visible, .ctl button:focus-visible, .tab:focus-visible, .trip-pill:focus-visible { outline: 2px solid #5a48b8; outline-offset: 2px; }

/* map controls */
.ctl { position: fixed; z-index: 1000; right: max(14px, env(safe-area-inset-right)); top: calc(14px + env(safe-area-inset-top)); display: flex; flex-direction: column; gap: 8px; }
.ctl button { width: 42px; height: 42px; border-radius: 14px; border: 0; background: var(--card); box-shadow: var(--shadow-sm); font-size: 18px; font-weight: 800; cursor: pointer; display: flex; align-items: center; justify-content: center; }
.ctl svg { width: 20px; height: 20px; }

/* left stack: hero + next */
.stack { position: fixed; z-index: 1000; left: max(16px, env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 370px; display: flex; flex-direction: column; gap: 12px; max-height: calc(100% - 90px); }
.hero { padding: 16px 18px; display: flex; flex-direction: column; gap: 6px; }
.hero .row1 { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.hero .who { display: flex; align-items: center; gap: 8px; min-width: 0; color: var(--muted); font-size: 13px; }
.badge { display: inline-flex; align-items: center; justify-content: center; min-width: 34px; height: 24px; padding: 0 9px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 12px; flex: none; }
.state { font-size: 12px; font-weight: 800; border-radius: 999px; padding: 3px 9px; white-space: nowrap; }
.state.late { color: var(--late); background: var(--late-bg); } .state.early { color: var(--early); background: var(--early-bg); } .state.ok { color: var(--ontime); background: var(--ontime-bg); }
.big { font-size: 48px; font-weight: 800; line-height: 1; letter-spacing: -0.02em; }
.big small { font-size: 16px; font-weight: 700; color: var(--muted); margin-left: 4px; letter-spacing: 0; }
.big.now { font-size: 36px; }
.sub { color: var(--muted); font-size: 13px; }
.sub b { color: var(--fg); }
.bar { height: 6px; background: var(--soft); border-radius: 3px; overflow: hidden; margin-top: 4px; }
.bar div { height: 100%; border-radius: 3px; transition: width 0.8s ease; }
.marks { display: flex; justify-content: space-between; gap: 8px; font-size: 11px; color: var(--muted); }
.marks span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.marks span:nth-child(2) { color: var(--fg); font-weight: 700; }
.actions { display: flex; gap: 8px; margin-top: 6px; }
.btn { flex: 1; border-radius: 14px; padding: 11px 12px; font-weight: 800; font-size: 13px; border: 0; background: var(--soft); cursor: pointer; }
.btn.pri { background: var(--pri); color: var(--pri-fg); }
.btn[aria-pressed="true"] { background: #5a48b8; color: #fff; }
.empty { color: var(--muted); font-size: 13px; padding: 4px 0; }

.listcard { padding: 12px 16px; overflow: auto; }
.listcard h2 { margin: 0 0 4px; font-size: 11px; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); font-weight: 800; display: flex; justify-content: space-between; gap: 8px; }
.listcard h2 button { border: 0; background: none; color: var(--muted); font-weight: 800; font-size: 11px; cursor: pointer; text-transform: none; letter-spacing: 0; }
.item { display: flex; align-items: center; gap: 10px; padding: 9px 0; border-top: 1px solid var(--line); }
.item:first-of-type { border-top: 0; }
.item .d { flex: 1; min-width: 0; font-size: 13px; }
.item .d span { display: block; color: var(--muted); font-size: 11px; }
.item .m { font-size: 17px; font-weight: 800; white-space: nowrap; }
.item .m small { font-size: 11px; color: var(--muted); font-weight: 600; display: block; text-align: right; }

/* right card: arrivals at a stop */
.side { position: fixed; z-index: 1000; right: max(16px, env(safe-area-inset-right)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 300px; max-height: calc(100% - 210px); }

/* phone: one bottom card with tabs */
.tabs { display: none; }
@media (max-width: 760px) {
  .top { right: 64px; }
  .stack { left: 10px; right: 10px; width: auto; bottom: calc(10px + env(safe-area-inset-bottom)); gap: 0; max-height: 62%; }
  .stack .card { border-radius: 22px; }
  .tabs { display: flex; gap: 6px; padding: 10px 12px 0; }
  .tab { flex: 1; border: 0; background: var(--soft); border-radius: 12px; padding: 8px; font-weight: 800; font-size: 12px; cursor: pointer; }
  .tab[aria-selected="true"] { background: var(--pri); color: var(--pri-fg); }
  .phone { display: flex; flex-direction: column; overflow: hidden; }
  .phone > .pane { overflow: auto; }
  .phone > .pane[hidden] { display: none; }
  .side { display: none; }
  .hero { padding: 12px 16px 14px; }
  .big { font-size: 42px; }
  .listcard { padding: 8px 16px 14px; }
  .phone .card { box-shadow: none; border-radius: 0; background: transparent; }
  #nextCard { margin-top: 0 !important; }
}
@media (min-width: 761px) { .phone { display: contents; } #paneTrip { display: contents; } #paneStop { display: none !important; } #nextCard { margin-top: 0 !important; } }

.buscard { position: fixed; z-index: 1001; left: max(16px, env(safe-area-inset-left)); top: calc(66px + env(safe-area-inset-top)); width: 320px; }
.buscard h2 button { font-size: 14px; }
.editor { position: fixed; inset: 0; z-index: 1200; background: rgba(10, 12, 8, 0.38); display: flex; align-items: flex-start; justify-content: center; padding: calc(60px + env(safe-area-inset-top)) 12px 12px; }
.editor[hidden] { display: none; }
.ed { width: min(460px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.edrow { display: flex; gap: 10px; align-items: center; }
.edstops { flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.edbtn { text-align: left; border: 2px solid transparent; background: var(--soft); border-radius: 14px; padding: 8px 12px; cursor: pointer; display: flex; flex-direction: column; min-width: 0; }
.edbtn span { font-size: 11px; color: var(--muted); font-weight: 700; }
.edbtn b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.edbtn[aria-pressed="true"] { border-color: #5a48b8; }
.swap { width: 44px; height: 44px; border-radius: 50%; border: 0; background: var(--soft); font-size: 20px; font-weight: 800; cursor: pointer; flex: none; }
.edsearch { display: flex; gap: 8px; }
.edsearch input { flex: 1; min-width: 0; border: 0; background: var(--soft); border-radius: 12px; padding: 11px 12px; font: 600 14px var(--sans); color: var(--fg); }
.edsearch .btn { flex: none; }
.edres { overflow: auto; display: flex; flex-direction: column; }
.res { display: flex; justify-content: space-between; align-items: center; gap: 10px; text-align: left; border: 0; background: none; padding: 10px 4px; border-top: 1px solid var(--line); cursor: pointer; }
.res > span:first-child { min-width: 0; }
.res b { display: block; font-size: 13px; }
.res span span { color: var(--muted); font-size: 11px; }
.res:hover, .res:focus-visible { background: var(--soft); }
.ls { display: flex; gap: 3px; flex: none; }
@media (max-width: 760px) { .buscard { left: 10px; right: 10px; width: auto; top: calc(104px + env(safe-area-inset-top)); } }
.toast { position: fixed; z-index: 1100; left: 50%; transform: translateX(-50%); top: calc(70px + env(safe-area-inset-top)); padding: 10px 16px; font-weight: 700; font-size: 13px; display: none; }
.toast.show { display: block; }

/* bus marker */
.busm { display: flex; align-items: center; justify-content: center; border-radius: 50%; color: #fff; font-weight: 800; font-size: 11px; border: 3px solid var(--bus-ring); box-shadow: 0 2px 8px rgba(0,0,0,.35); width: 32px; height: 32px; }
.busm.mine { width: 40px; height: 40px; font-size: 13px; box-shadow: 0 0 0 4px rgba(90,72,184,.25), 0 2px 8px rgba(0,0,0,.35); }
.leaflet-popup-content-wrapper { border-radius: 16px; background: var(--card); color: var(--fg); box-shadow: var(--shadow); }
.leaflet-popup-tip { background: var(--card); }
.leaflet-popup-content { margin: 12px 14px; font-family: var(--sans); }
.pop b { display: block; font-size: 14px; }
.pop .l { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
.pop .acts { display: flex; gap: 6px; flex-wrap: wrap; }
.pop button { border: 0; border-radius: 10px; padding: 7px 10px; font-weight: 800; font-size: 12px; background: var(--soft); cursor: pointer; }
.pop button.pri { background: var(--pri); color: var(--pri-fg); }
@media (prefers-reduced-motion: reduce) { .bar div { transition: none; } }

/* ---- network version additions ---- */
.trip-wrap { display: flex; align-items: center; max-width: 100%; min-width: 0; }
.trip-wrap .trip-pill { background: none; box-shadow: none; padding-right: 8px; min-width: 0; }
.trip-x { border: 0; background: var(--soft); border-radius: 999px; width: 26px; height: 26px; margin-right: 6px; cursor: pointer; font-weight: 800; flex: none; }
.trip-x[hidden] { display: none; }
.edside { display: flex; flex-direction: column; gap: 6px; }
.edres { min-height: 0; }
.ed { max-height: calc(100dvh - 80px); }
.lines-pill { display: flex; align-items: center; gap: 8px; padding: 9px 14px; font-weight: 800; font-size: 13px; border: 0; cursor: pointer; }
.lines-pill .sw { display: flex; }
.lines-pill .sw i { width: 10px; height: 10px; border-radius: 50%; margin-left: -3px; border: 2px solid var(--card); }
.mode-pill { display: flex; align-items: center; gap: 8px; padding: 7px 8px 7px 14px; font-weight: 800; font-size: 13px; }
.mode-pill button { border: 0; background: var(--soft); border-radius: 999px; width: 26px; height: 26px; cursor: pointer; font-weight: 800; }

.picker { position: fixed; inset: 0; z-index: 1200; background: rgba(10, 12, 8, 0.38); display: flex; align-items: flex-start; justify-content: center; padding: calc(60px + env(safe-area-inset-top)) 12px 12px; }
.picker[hidden] { display: none; }
.pk { width: min(620px, 100%); max-height: 100%; display: flex; flex-direction: column; gap: 12px; padding: 16px; }
.pkhead { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
.pkhead input { flex: 1 1 180px; min-width: 0; border: 0; background: var(--soft); border-radius: 12px; padding: 11px 12px; font: 600 14px var(--sans); color: var(--fg); }
.pkhead .btn { flex: none; padding: 10px 12px; }
.pkgrid { overflow: auto; display: grid; grid-template-columns: repeat(auto-fill, minmax(170px, 1fr)); gap: 6px; }
.lt { display: flex; align-items: center; gap: 10px; text-align: left; border: 2px solid transparent; background: var(--soft); border-radius: 14px; padding: 8px 10px; cursor: pointer; min-width: 0; }
.lt[aria-pressed="true"] { border-color: var(--fg); background: var(--card); }
.lt[aria-pressed="false"] .badge { opacity: 0.45; }
.lt span.nm { font-size: 11px; color: var(--muted); line-height: 1.25; overflow: hidden; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.pkfoot { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; color: var(--muted); }

.stopcard { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; overflow: hidden; }
.stopcard .head { display: flex; align-items: flex-start; justify-content: space-between; gap: 10px; }
.stopcard .head b { font-size: 16px; line-height: 1.25; }
.stopcard .head .x { border: 0; background: var(--soft); border-radius: 50%; width: 32px; height: 32px; cursor: pointer; font-weight: 800; flex: none; }
.stopcard .meta { display: flex; gap: 4px; flex-wrap: wrap; align-items: center; color: var(--muted); font-size: 12px; }
.stopcard .meta .badge { height: 18px; min-width: 26px; font-size: 10px; padding: 0 6px; }
.stopcard .list { overflow: auto; margin-top: 4px; }
.arr { display: flex; align-items: center; gap: 10px; padding: 9px 6px; border-top: 1px solid var(--line); cursor: pointer; border-radius: 10px; width: 100%; text-align: left; border-left: 0; border-right: 0; border-bottom: 0; background: none; }
.arr:hover, .arr:focus-visible, .arr.sel { background: var(--soft); }
.arr .d { flex: 1; min-width: 0; font-size: 13px; }
.arr .d span { display: block; color: var(--muted); font-size: 11px; }
.arr .m { font-size: 18px; font-weight: 800; white-space: nowrap; text-align: right; }
.arr .m small { display: block; font-size: 11px; color: var(--muted); font-weight: 600; }
.stopacts { display: flex; gap: 6px; margin-top: 8px; }
.stopacts .btn { padding: 9px 10px; font-size: 12px; }

.busp { display: inline-flex; align-items: center; gap: 4px; padding: 0 9px 0 4px; height: 28px; border-radius: 999px; color: #fff; font-weight: 800; font-size: 12px; border: 2px solid var(--bus-ring); box-shadow: 0 2px 8px rgba(0,0,0,.35); white-space: nowrap; }
.busp b { background: rgba(255,255,255,.22); border-radius: 999px; padding: 1px 7px; font-size: 11px; }
.busp.sel { outline: 3px solid rgba(90,72,184,.55); }
.busp.ghost { border-style: dashed; border-width: 2px; opacity: 0.9; }
.stopmark { width: 22px; height: 22px; border-radius: 50%; background: #ffcc33; border: 4px solid #1f211d; box-shadow: 0 2px 10px rgba(0,0,0,.4); }
@media (max-width: 760px) {
  .pk { padding: 12px; }
  .pkgrid { grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); }
  #stopPanel { left: 10px; right: 10px; width: auto; bottom: calc(10px + env(safe-area-inset-bottom)); max-height: 55%; }
}
#stopPanel { position: fixed; z-index: 1001; left: max(16px, env(safe-area-inset-left)); bottom: calc(16px + env(safe-area-inset-bottom)); width: 380px; max-height: calc(100% - 90px); display: flex; flex-direction: column; }
#stopPanel[hidden], .stack[hidden], .mode-pill[hidden] { display: none; }
@media (max-width: 760px) { #stopPanel { left: 10px; right: 10px; width: auto; bottom: calc(10px + env(safe-area-inset-bottom)); max-height: 48%; } .stopcard .list { min-height: 0; } }
</style>
</head>

<div id="map" role="application" aria-label="Mapa de buses de Vigo"></div>

<div class="top">
  <div class="pill trip-wrap"><button class="trip-pill" id="tripPill" title="Cambiar mi trayecto"><span class="dot"></span><span class="t" id="tripText">…</span></button><button class="trip-x" id="tripClear" aria-label="Quitar trayecto" title="Quitar trayecto">✕</button></div>
  <button class="pill lines-pill" id="linesPill"><span class="sw" id="linesSw"></span><span id="linesTxt">Líneas</span></button>
  <div class="pill mode-pill" id="modePill" hidden><span id="modeTxt"></span><button id="modeClose" aria-label="Volver a todas las líneas">✕</button></div>
</div>

<div class="ctl">
  <button id="zin" aria-label="Acercar">+</button>
  <button id="zout" aria-label="Alejar">−</button>
  <button id="themeBtn" aria-label="Tema"></button>
  <button id="locBtn" aria-label="Mi ubicación"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"><path d="M21 3 3 10.5l7.5 3 3 7.5z"/></svg></button>
  <button id="recenter" aria-label="Ver mi trayecto"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg></button>
</div>

<div class="stack" id="stack">
  <section class="card hero" id="hero" aria-live="polite"><div class="empty">Cargando datos en tiempo real…</div></section>
  <section class="card listcard" id="nextCard"><h2>Próximas en tu parada</h2><div id="nextList"></div></section>
</div>

<section class="card stopcard" id="stopPanel" hidden aria-live="polite"></section>
<section class="card listcard buscard" id="busCard" hidden aria-live="polite"></section>

<div class="picker" id="picker" hidden>
  <div class="card pk" role="dialog" aria-label="Elegir líneas">
    <div class="pkhead">
      <input id="pkSearch" type="search" placeholder="Busca una línea: 15C, Universidade, Samil…" autocomplete="off">
      <button class="btn" id="pkAll">Todas</button>
      <button class="btn" id="pkNone">Ninguna</button>
      <button class="btn" id="pkMine">Las de mi trayecto</button>
    </div>
    <div class="pkgrid" id="pkGrid"></div>
    <div class="pkfoot"><span id="pkInfo"></span><button class="btn pri" id="pkClose" style="flex:none">Listo</button></div>
  </div>
</div>

<div class="editor" id="editor" hidden>
  <div class="card ed" role="dialog" aria-label="Cambiar trayecto">
    <div class="edrow">
      <div class="edstops">
        <button class="edbtn" id="edOriginBtn"><span>Subo en</span><b id="edOrigin"></b></button>
        <button class="edbtn" id="edDestBtn"><span>Bajo en</span><b id="edDest"></b></button>
      </div>
      <div class="edside"><button class="swap" id="edSwap" aria-label="Invertir trayecto" title="Invertir trayecto">⇅</button><button class="swap" id="edClearTop" aria-label="Quitar trayecto" title="Quitar trayecto">✕</button></div>
    </div>
    <div class="edsearch"><input id="edSearch" type="search" autocomplete="off"><button class="btn" id="edNear">Cerca de mí</button></div>
    <div class="edres" id="edResults"></div>
    <div class="actions"><button class="btn" id="edClear">Quitar trayecto</button><button class="btn pri" id="edClose">Cerrar</button></div>
  </div>
</div>
<div class="pill toast" id="toast" role="status"></div>

<script defer src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script type="module">
// ---------- data (data/*.json, written by tools/assemble2.js) ----------
const loadData = f => fetch(`data/${f}.json?v=be53a1b6fc`).then(r => { if (!r.ok) throw new Error(f + ' ' + r.status); return r.json(); });
let NET, SCHED;
try { [NET, SCHED] = await Promise.all([loadData('net'), loadData('sched')]); }
catch (e) { document.getElementById('hero').innerHTML = '<div class="empty">No se pudieron cargar las líneas. Recarga la página.</div>'; throw e; }
function decodePolyline(s) {

    const expect = e.metros + gap;
    let destMin = null, sure = false;
    const passT = new Date(now.getTime() + e.minutos * 60000);
    const sch = rutaReachesDest(e.linea, e.ruta, passT);
    const knowsLabel = hasSchedule(prefs.origin, e.linea);
    // when the timetable knows this line at the destination, it decides whether this trip gets there
    const mayReach = sch ? true : knowsLabel ? false : !/fadrique|remata/i.test(e.ruta);
    if (atD && mayReach) {
      // each bus at the destination can only be one of ours, and must arrive after it passes our stop
      const c = atD.filter(x => x.linea === e.linea && !usedDest.has(x) && x.minutos >= e.minutos + gap / 1000)
        .map(x => ({ x, err: Math.abs(x.metros - expect) })).sort((a, b) => a.err - b.err)[0];
      if (c && c.err < Math.max(900, 0.35 * expect)) { destMin = c.x.minutos; sure = true; usedDest.add(c.x); }
    }
    const reaches = mayReach;
    if (destMin === null && reaches) {
      // timetable gives the travel time between the two stops; otherwise ~2.4 min per km
      destMin = sch ? Math.round(e.minutos + (sch.t - (delayFor(e.linea, e.ruta, e.minutos)?.at || passT)) / 60000) : Math.round(e.minutos + gap / 1000 * 2.4);
    }
    out.push({ kind: 'live', e, line: e.linea, ruta: e.ruta, min: e.minutos, r, along: r.stopById.get(prefs.origin).d - e.metros, destMin, sure, reaches, delay: delayFor(e.linea, e.ruta, e.minutos) });
  }
  // timetable departures not covered by a live bus (beyond the live horizon, or buses not yet out)
  for (const line of LINES) {
    const r = tripRoute(line); if (!r) continue;
    for (const x of schedule(prefs.origin, line, now, 90)) {
      const min = Math.round((x.t - now) / 60000);
      const covered = out.some(t => t.line === line && t.delay && Math.abs(t.delay.at - x.t) < 60000);
      if (covered || min < 0) continue;
      const atDest = rutaReachesDest(line, x.ruta, x.t);
      if (!atDest) continue;
      out.push({ kind: 'sched', line, ruta: x.ruta, min, r, destMin: Math.round((atDest.t - now) / 60000), sure: false, reaches: true, delay: null, at: x.t });
    }
  }
  return out.sort((a, b) => (b.reaches - a.reaches) || (a.min - b.min));
}
let heroBus = null;
function stateBadge(t) {
  if (t.kind === 'sched') return `<span class="state">Programado</span>`;
  const d = t.delay; if (!d) return '';
  if (d.diff >= 2) return `<span class="state late">+${d.diff} min</span>`;
  if (d.diff <= -2) return `<span class="state early">${d.diff} min</span>`;
  return `<span class="state ok">A su hora</span>`;
}
function renderHero() {
  const el = document.getElementById('hero');
  if (!hasTrip()) { heroBus = null; return; }
  const T = trips();
  if (T === null) { el.innerHTML = `<div class="empty">No se pudo consultar tu parada. Lo reintento en unos segundos.</div>`; return; }
  const t = T.find(x => x.reaches);
  if (!t) { el.innerHTML = `<div class="row1"><b>${stopName(prefs.origin)}</b></div><div class="empty">No hay buses hacia ${shortName(stopName(prefs.dest))} en la próxima hora y media.</div>`; heroBus = null; renderNext(T); return; }
  const now = new Date();
  const passAt = hhmm(new Date(now.getTime() + t.min * 60000)), arrAt = t.destMin !== null ? hhmm(new Date(now.getTime() + t.destMin * 60000)) : '—';
  let progress = '';
  heroBus = null;
  if (t.kind === 'live') {
    const passed = t.r.stops.filter(s => s.d <= t.along).pop();
    const windowM = 6000, pct = Math.max(4, Math.min(100, 100 * (1 - t.e.metros / windowM)));
    const startStop = t.r.stops.filter(s => s.d <= t.r.stopById.get(prefs.origin).d - windowM).pop();
    const stopsLeft = t.r.stops.filter(s => s.d > t.along && s.d <= t.r.stopById.get(prefs.origin).d).length;
    progress = `<div class="bar"><div style="width:${pct}%;background:${t.r.color}"></div></div>
      <div class="marks"><span>${startStop ? shortName(startStop.name) : ''}</span><span>${passed ? 'Ahora: ' + shortName(passed.name) : 'Saliendo de cabecera'}</span><span>${stopsLeft} ${stopsLeft === 1 ? 'parada' : 'paradas'}</span></div>`;
    heroBus = [...buses.values()].filter(b => b.route === t.r).sort((a, b) => Math.abs(a.fix - t.along) - Math.abs(b.fix - t.along))[0] || null;
    if (heroBus && Math.abs(heroBus.fix - t.along) > 1500) heroBus = null;
  } else {
    progress = `<div class="sub">Aún no está en ruta: es la hora del horario de Vitrasa.</div>`;
  }
  const following = follow && heroBus && follow === heroBus.id;
  el.innerHTML = `
    <div class="row1"><span class="who"><span class="badge" style="background:${t.r.color}">${t.line}</span><span style="overflow:hidden;text-overflow:ellipsis;white-space:nowrap">→ ${t.ruta}</span></span>${stateBadge(t)}</div>
    ${t.min <= 0 ? '<div class="big now">Llegando</div>' : `<div class="big n">${t.min}<small>min</small></div>`}
    <div class="sub n">Pasa por <b>${shortName(stopName(prefs.origin))}</b> a las <b>${passAt}</b> · llegas a ${shortName(stopName(prefs.dest))} <b>${arrAt}</b>${t.sure ? '' : ' (aprox.)'}</div>
    ${progress}
    <div class="actions">
      <button class="btn pri" id="alertBtn" aria-pressed="${alertOn}">${alertOn ? 'Te aviso a 5 min' : 'Avisarme'}</button>
      <button class="btn" id="followBtn" aria-pressed="${!!following}" ${t.kind === 'sched' ? 'disabled style="opacity:.5"' : ''}>${following ? 'Siguiendo' : 'Seguir en el mapa'}</button>
    </div>`;
  document.getElementById('alertBtn').onclick = toggleAlert;
  document.getElementById('followBtn').onclick = () => {
    if (!heroBus) { toast('Este bus aún no está en el mapa'); return; }
    if (following) { follow = null; } else { follow = heroBus.id; map.setView(heroBus.marker.getLatLng(), Math.max(map.getZoom(), 15)); showBusCard(heroBus); }
    renderHero(); restyleBuses();
  };
  restyleBuses();
  checkAlert(t);
  renderNext(T, t);
}
function nextLabel(t) {
  if (!t.reaches) return 'no va a tu destino';
  const arr = t.destMin !== null ? ' · llega ' + hhmm(new Date(Date.now() + t.destMin * 60000)) : '';
  if (t.kind === 'sched') return 'programado' + arr;
  const d = t.delay;
  return (d ? (d.diff >= 2 ? `${d.diff} min tarde` : d.diff <= -2 ? `${-d.diff} min antes` : 'a su hora') : 'en ruta') + arr;
}
function renderNext(T, hero) {
  const el = document.getElementById('nextList');
  const rest = (T || []).filter(t => t !== hero).slice(0, 5);
  if (!rest.length) { el.innerHTML = '<div class="empty">No hay más buses en la próxima hora y media.</div>'; return; }
  el.innerHTML = rest.map(t => `<div class="item"${t.kind === 'sched' ? ' style="opacity:.75"' : ''}><span class="badge" style="background:${t.r.color}">${t.line}</span>
    <span class="d">${t.ruta}<span>${nextLabel(t)}</span></span>
    <span class="m n">${t.kind === 'sched' ? hhmm(t.at) : (t.min <= 0 ? 'Ya' : t.min + '′')}</span></div>`).join('');
}
// ---------- bus card ----------
let busCardId = null;
function showBusCard(b) { busCardId = b ? b.id : null; renderBusCard(); }
function renderBusCard() {
  const el = document.getElementById('busCard');
  const b = busCardId && buses.get(busCardId);
  if (!b) { el.hidden = true; return; }
  const r = b.route, ahead = r.stops.filter(s => s.d > b.shown).slice(0, 4);
  const rows = ahead.map(s => {
    const l = results.get(s.id);
    const e = l && l.filter(x => x.linea === r.line).map(x => ({ x, err: Math.abs(x.metros - (s.d - b.fix)) })).sort((p, q) => p.err - q.err)[0];
    const min = e && e.err < 900 + 0.3 * (s.d - b.fix) ? e.x.minutos : Math.max(0, Math.round((s.d - b.shown) / 1000 * 2.4));
    const mine = s.id === prefs.origin ? ' · tu parada' : s.id === prefs.dest ? ' · tu destino' : '';
    return `<div class="item"><span class="d">${s.name}<span>${mine ? mine.slice(3) : ''}</span></span><span class="m n">${min <= 0 ? 'Ya' : min + '′'}</span></div>`;
  }).join('');
  const following = follow === b.id;
  el.innerHTML = `<h2><span style="display:flex;align-items:center;gap:8px"><span class="badge" style="background:${r.color}">${r.line}</span><span style="text-transform:none;letter-spacing:0;color:var(--fg);font-size:13px">→ ${b.info.ruta}</span></span><button id="busClose" aria-label="Cerrar">✕</button></h2>
    <div class="sub" style="margin:2px 0 4px">Próximas paradas</div>${rows || '<div class="empty">Llegando a final de línea.</div>'}
    <div class="actions"><button class="btn${following ? '' : ' pri'}" id="busFollow">${following ? 'Dejar de seguir' : 'Seguir este bus'}</button></div>`;
  el.hidden = false;
  el.querySelector('#busClose').onclick = () => { busCardId = null; if (follow === b.id) { follow = null; renderHero(); restyleBuses(); } renderBusCard(); };
  el.querySelector('#busFollow').onclick = () => { follow = following ? null : b.id; if (follow) map.setView(b.marker.getLatLng(), Math.max(map.getZoom(), 15)); renderHero(); restyleBuses(); renderBusCard(); };
}

// ---------- trip editor ----------
const norm = s => s.normalize('NFD').replace(/[̀-ͯ]/g, '').toLowerCase();
let editing = 'origin';
function openEditor(which) {
  editing = which || 'origin';
  const el = document.getElementById('editor'); el.hidden = false;
  document.getElementById('edOrigin').textContent = prefs.origin ? stopName(prefs.origin) : 'Sin elegir';
  document.getElementById('edDest').textContent = prefs.dest ? stopName(prefs.dest) : 'Sin elegir';
  document.getElementById('edOriginBtn').setAttribute('aria-pressed', String(editing === 'origin'));
  document.getElementById('edDestBtn').setAttribute('aria-pressed', String(editing === 'dest'));
  const q = document.getElementById('edSearch'); q.value = ''; q.placeholder = editing === 'origin' ? 'Busca dónde subes: Torrecedeira, Urzáiz…' : 'Busca dónde bajas: Xurídicas, Humanidades…';
  renderSearch(); setTimeout(() => q.focus(), 50);
}
function closeEditor() { document.getElementById('editor').hidden = true; }
function renderSearch() {
  const q = norm(document.getElementById('edSearch').value.trim());
  const all = [...STOPS.values()];
  let list;
  if (!q) list = myPos ? all.slice().sort((a, b) => hav([a.lat, a.lon], myPos) - hav([b.lat, b.lon], myPos)).slice(0, 6) : all.filter(s => /cuvi/i.test(s.name)).slice(0, 7);
  else list = all.filter(s => norm(s.name).includes(q) || String(s.id).startsWith(q)).slice(0, 12);
  document.getElementById('edResults').innerHTML = (q ? '' : `<div class="sub" style="padding:4px 0">${myPos ? 'Cerca de ti' : 'Campus (CUVI)'}</div>`) + list.map(s => `<button class="res" data-id="${s.id}">
    <span><b>${s.name}</b><span>${s.id}${myPos ? ' · ' + Math.round(hav([s.lat, s.lon], myPos)) + ' m' : ''}</span></span>
    <span class="ls">${[...s.lines].map(l => `<span class="badge" style="background:${LINE_COLORS[l]};height:18px;min-width:26px;font-size:10px">${l}</span>`).join('')}</span></button>`).join('') ||
    '<div class="empty">Ninguna parada de estas líneas con ese nombre.</div>';
}
function setTripStop(which, id) {
  if (which === 'origin') { if (id === prefs.dest) prefs.dest = prefs.origin; prefs.origin = id; }
  else { if (id === prefs.origin) prefs.origin = prefs.dest; prefs.dest = id; }
  viewStop = prefs.dest; savePrefs(); afterTripChange();
}



// ---------- my location ----------
let myPos = null, myMarker = null;
function locate() {
  if (!navigator.geolocation) { toast('Tu navegador no permite saber dónde estás'); return; }
  navigator.geolocation.getCurrentPosition(p => {
    myPos = [p.coords.latitude, p.coords.longitude];
    if (!myMarker) myMarker = L.circleMarker(myPos, { radius: 8, color: '#fff', weight: 3, fillColor: '#2b7de9', fillOpacity: 1 }).addTo(map);
    myMarker.setLatLng(myPos);
    const near = [...STOPS.values()].sort((a, b) => hav([a.lat, a.lon], myPos) - hav([b.lat, b.lon], myPos))[0];
    const dist = Math.round(hav([near.lat, near.lon], myPos));
    map.setView(myPos, 16);
    if (dist < 3000) toast(`Parada más cercana: ${shortName(near.name)} (${dist} m)`); else toast('Estás lejos de estas líneas');
    if (!document.getElementById('editor').hidden) renderSearch();
  }, () => toast('No se pudo obtener tu ubicación'), { enableHighAccuracy: true, timeout: 10000 });
}



// ---------- alert ----------
let alertOn = false, alerted = null, audio;
function beep() { try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); const o = audio.createOscillator(), g = audio.createGain(); o.connect(g); g.connect(audio.destination); o.frequency.value = 880; g.gain.setValueAtTime(0.2, audio.currentTime); g.gain.exponentialRampToValueAtTime(0.001, audio.currentTime + 0.6); o.start(); o.stop(audio.currentTime + 0.6); } catch (e) {} }
function toggleAlert() {
  alertOn = !alertOn; alerted = null;
  if (alertOn) { try { if ('Notification' in window && Notification.permission === 'default') Notification.requestPermission(); } catch (e) {} try { audio = audio || new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} toast('Te aviso cuando falten 5 minutos'); }
  renderHero();
}
function checkAlert(t) {
  if (!alertOn || !t || t.kind !== "live" || t.min > 5 || !prefs.origin) return;
  // one alert per bus: identify it by line and expected arrival (5-minute slot), not by its position
  const key = t.line + ":" + Math.round((Date.now() + t.min * 60000) / 300000);
  if (alerted === key) return; alerted = key;
  const msg = `Tu ${t.line} llega a ${shortName(stopName(prefs.origin))} en ${t.min} min`;
  toast(msg); beep();
  try { if ('Notification' in window && Notification.permission === 'granted') new Notification('Sal ya', { body: msg }); } catch (e) {}
}



// ---------- editor wiring ----------
document.getElementById('edOriginBtn').onclick = () => openEditor('origin');
document.getElementById('edDestBtn').onclick = () => openEditor('dest');
function reachable(o, d) { return ROUTES.some(r => r.stopById.has(o) && r.stopById.has(d) && r.stopById.get(d).d > r.stopById.get(o).d); }
function counterpart(id, other, asOrigin) {
  const s = STOPS.get(id);
  const c = [...STOPS.values()].filter(x => hav([x.lat, x.lon], [s.lat, s.lon]) < 350 && (asOrigin ? reachable(x.id, other) : reachable(other, x.id)))
    .sort((a, b) => hav([a.lat, a.lon], [s.lat, s.lon]) - hav([b.lat, b.lon], [s.lat, s.lon]));
  return c.length ? c[0].id : id;
}
document.getElementById('edSwap').onclick = () => {
  let o = prefs.dest, d = prefs.origin;
  if (!o || !d) { prefs.origin = o; prefs.dest = d; savePrefs(); afterTripChange(); openEditor(editing); return; }
  if (!reachable(o, d)) { const o2 = counterpart(o, d, true); if (reachable(o2, d)) o = o2; else { const d2 = counterpart(d, o, false); if (reachable(o, d2)) d = d2; } }
  prefs.origin = o; prefs.dest = d; savePrefs(); afterTripChange(); openEditor(editing);
};
document.getElementById('edNear').onclick = locate;
document.getElementById('edClose').onclick = closeEditor;
function clearTrip() { prefs.origin = null; prefs.dest = null; alertOn = false; savePrefs(); afterTripChange(); closeEditor(); toast('Trayecto quitado: solo el mapa'); }
document.getElementById('tripClear').onclick = clearTrip;
document.getElementById('edClearTop').onclick = clearTrip;
document.getElementById('edClear').onclick = () => { prefs.origin = null; prefs.dest = null; alertOn = false; savePrefs(); afterTripChange(); closeEditor(); toast('Sin trayecto: solo el mapa'); };
document.getElementById('editor').addEventListener('click', e => { if (e.target.id === 'editor') closeEditor(); });
document.getElementById('edSearch').addEventListener('input', renderSearch);
document.getElementById('edResults').addEventListener('click', e => { const b = e.target.closest('.res'); if (!b) return; setTripStop(editing, +b.dataset.id); if (editing === 'origin') openEditor('dest'); else closeEditor(); });

// ---------- start ----------
let viewStop = prefs.dest;
renderTripText(); renderLinesPill(); drawRoutes(); refreshStops(); tick();
</script>
